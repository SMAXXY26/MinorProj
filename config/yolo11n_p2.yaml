# YOLO11n with P2 shallow feature fusion head (P2/4 – P5/32 outputs)
#
# Adds a detection head at stride 4 (P2) by routing the upsample path one
# level deeper into the backbone and fusing with the high-resolution P2
# feature map (layer 2) before spatial detail is lost by striding.
#
# Use via: student.model: config/yolo11n_p2.yaml  in hyperparams.yaml
# Architecture: identical backbone to yolo11.yaml; 4-head (P2/P3/P4/P5) neck.
#
# Receptive field per head at 640 input:
#   P2 → stride  4 → 160×160 feature grid → detects objects ≥ 4 px
#   P3 → stride  8 →  80×80              → detects objects ≥ 8 px
#   P4 → stride 16 →  40×40              → detects objects ≥ 16 px
#   P5 → stride 32 →  20×20              → detects objects ≥ 32 px

nc: 3  # knife / pistol / rifle

scales:
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]

# ── Backbone (identical to yolo11.yaml) ───────────────────────────────────────
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv,   [64,  3, 2]]          # 0  P1/2   (320×320 @ 640 in)
  - [-1, 1, Conv,   [128, 3, 2]]          # 1  P2/4   (160×160)
  - [-1, 2, C3k2,   [256, False, 0.25]]   # 2  P2 features ← shallow fusion tap
  - [-1, 1, Conv,   [256, 3, 2]]          # 3  P3/8   (80×80)
  - [-1, 2, C3k2,   [512, False, 0.25]]   # 4  P3 features
  - [-1, 1, Conv,   [512, 3, 2]]          # 5  P4/16  (40×40)
  - [-1, 2, C3k2,   [512, True]]          # 6  P4 features
  - [-1, 1, Conv,   [1024, 3, 2]]         # 7  P5/32  (20×20)
  - [-1, 2, C3k2,   [1024, True]]         # 8  P5 features
  - [-1, 1, SPPF,   [1024, 5]]            # 9
  - [-1, 2, C2PSA,  [1024]]               # 10 enriched P5

# ── Head: top-down path ───────────────────────────────────────────────────────
head:
  - [-1,    1, nn.Upsample, [None, 2, "nearest"]]  # 11  P5→P4 scale
  - [[-1, 6], 1, Concat,    [1]]                   # 12  cat backbone P4
  - [-1,    2, C3k2,        [512, False]]           # 13  P4 neck

  - [-1,    1, nn.Upsample, [None, 2, "nearest"]]  # 14  P4→P3 scale
  - [[-1, 4], 1, Concat,    [1]]                   # 15  cat backbone P3
  - [-1,    2, C3k2,        [256, False]]           # 16  P3 neck

  # ── Shallow fusion branch (new P2 head) ─────────────────────────────────
  - [-1,    1, nn.Upsample, [None, 2, "nearest"]]  # 17  P3→P2 scale
  - [[-1, 2], 1, Concat,    [1]]                   # 18  cat backbone P2 (layer 2)
  - [-1,    2, C3k2,        [128, False]]           # 19  P2/4-xsmall features

  # ── Bottom-up path (rejoin standard PAN) ─────────────────────────────────
  - [-1,     1, Conv,  [128, 3, 2]]                # 20  P2→P3
  - [[-1, 16], 1, Concat, [1]]                     # 21  cat P3 neck (layer 16)
  - [-1,     2, C3k2,  [256, False]]               # 22  P3/8-small

  - [-1,     1, Conv,  [256, 3, 2]]                # 23  P3→P4
  - [[-1, 13], 1, Concat, [1]]                     # 24  cat P4 neck (layer 13)
  - [-1,     2, C3k2,  [512, False]]               # 25  P4/16-medium

  - [-1,     1, Conv,  [512, 3, 2]]                # 26  P4→P5
  - [[-1, 10], 1, Concat, [1]]                     # 27  cat enriched P5 (layer 10)
  - [-1,     2, C3k2,  [1024, True]]               # 28  P5/32-large

  - [[19, 22, 25, 28], 1, Detect, [nc]]            # 29  Detect(P2, P3, P4, P5)
