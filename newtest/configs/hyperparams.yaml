# =============================================================================
#  Weapon Detection — Hyperparameter & Architecture Config
#  Stage 1 : YOLOv8x-OBB   (oriented bounding box detector)
#  Stage 2 : EfficientNet-B5 (fine-grained weapon classifier)
#  Stage 3 : BiLSTM          (temporal consistency smoother)
# =============================================================================

project:
  name: weapon_detection_john_wick
  version: "1.0"
  seed: 42

# ── Dataset ──────────────────────────────────────────────────────────────────
dataset:
  root: ./data/dataset_split
  train_split: 0.75
  val_split:   0.15
  test_split:  0.10
  img_size: 640            # detector input (must be multiple of 32)
  classifier_img_size: 224 # EfficientNet-B5 input
  num_workers: 8
  pin_memory: true

  # Weapon taxonomy — keep this consistent across detector + classifier
  classes:
    - pistol
    - revolver
    - rifle
    - shotgun
    - smg
    - knife
    - blunt_weapon
  num_classes: 7

# ── Stage 1: YOLOv8x-OBB Detector ────────────────────────────────────────────
detector:
  backbone: yolov8x           # x = deepest/widest variant
  mode: obb                   # oriented bounding box (gives rotation angle θ)
  pretrained_weights: yolov8x-obb.pt
  img_size: 640

  # Training
  epochs: 150
  batch_size: 16              # reduce to 8 if <16 GB VRAM
  accumulate_grad_batches: 2  # effective batch = 32
  optimizer: AdamW
  lr0: 0.001                  # initial LR
  lrf: 0.01                   # final LR = lr0 * lrf (cosine schedule)
  momentum: 0.937
  weight_decay: 0.0005
  warmup_epochs: 3
  warmup_momentum: 0.8
  warmup_bias_lr: 0.1

  # Loss weights
  box_loss_gain: 7.5
  cls_loss_gain: 0.5
  dfl_loss_gain: 1.5
  angle_loss_gain: 0.5        # extra term for OBB rotation prediction

  # Inference thresholds
  conf_threshold: 0.35
  iou_threshold: 0.45         # NMS IoU (use rotated IoU for OBB)
  max_det: 100

  # Multi-scale training
  multi_scale: true           # randomly resize input ∈ [0.5×, 1.5×] each batch

# ── Stage 2: EfficientNet-B5 Classifier ──────────────────────────────────────
classifier:
  backbone: efficientnet_b5
  pretrained: true            # ImageNet weights
  num_classes: 7
  dropout_rate: 0.4
  label_smoothing: 0.1

  epochs: 80
  batch_size: 64
  optimizer: AdamW
  lr: 0.0003
  weight_decay: 0.01
  scheduler: cosine_with_restarts
  T_0: 20                     # restart period in epochs
  T_mult: 2
  eta_min: 1.0e-6

  # Mixup / CutMix
  mixup_alpha: 0.4
  cutmix_alpha: 1.0
  mixup_prob: 0.5

  # Focal loss for class imbalance
  use_focal_loss: true
  focal_gamma: 2.0
  focal_alpha: 0.25

  # Input crop: use only the detector's tight bounding box crop
  crop_padding_ratio: 0.15    # add 15% padding around each crop

# ── Stage 3: BiLSTM Temporal Smoother ────────────────────────────────────────
temporal:
  hidden_size: 128
  num_layers: 2
  bidirectional: true
  dropout: 0.3
  window_size: 8              # frames in sliding window
  input_size: 14              # per-frame feature: [conf, x,y,w,h,θ, cls_logits×7, motion_mag]

  epochs: 30
  batch_size: 32
  lr: 0.001
  weight_decay: 0.001
  scheduler: step
  step_size: 10
  gamma: 0.5

  # Smoothing threshold — suppress detections below this after temporal pass
  smooth_conf_threshold: 0.4

# ── Geometry Extraction ───────────────────────────────────────────────────────
geometry:
  # Contour / polygon fitting applied to segmentation mask output
  contour_method: CHAIN_APPROX_SIMPLE
  poly_epsilon_ratio: 0.02    # Douglas-Peucker ε = ε_ratio × arc_length
  min_contour_area: 200       # px² — ignore tiny noise contours
  fit_ellipse: true           # fit minimum enclosing ellipse → axes + angle
  fit_obb: true               # fit minimum-area rotated rect → angle
  compute_skeleton: false     # medial axis (expensive; useful for blade length)

  # Keypoint definitions per class (used if keypoint head is enabled)
  keypoints:
    pistol:      ["barrel_tip", "trigger_guard", "grip_base", "hammer"]
    rifle:       ["barrel_tip", "front_sight", "trigger", "stock_end"]
    knife:       ["blade_tip", "blade_base", "handle_end"]
    blunt_weapon:["head_tip",  "handle_end"]

# ── Augmentation (training only) ─────────────────────────────────────────────
augmentation:
  # Spatial
  random_flip_lr: 0.5
  random_flip_ud: 0.0         # upside-down weapons are rare and semantically different
  random_rotate_deg: 15       # ±15° global rotation
  perspective: 0.001
  scale: 0.9                  # ±scale jitter

  # Photometric — critical for John Wick domain
  hsv_h: 0.015
  hsv_s: 0.7
  hsv_v: 0.5                  # heavy brightness aug for dark scenes
  random_brightness: 0.3
  random_contrast: 0.3

  # Domain-specific
  motion_blur_prob: 0.4       # blur kernel 5–25px along random direction
  motion_blur_kernel: [5, 25]
  low_light_prob: 0.3         # randomly darken + add Gaussian noise
  low_light_gamma: [0.3, 0.7] # gamma range for darkening

  # Occlusion simulation
  random_erase_prob: 0.3
  random_erase_count: [1, 3]
  random_erase_area:  [0.02, 0.35]

  # YOLOv8 native augmentations
  mosaic: 1.0                 # probability — use mosaic every batch
  mixup: 0.15
  copy_paste: 0.1             # paste weapon instances across images

# ── Hardware / Runtime ────────────────────────────────────────────────────────
hardware:
  device: cuda                # "cpu" fallback auto-detected
  amp: true                   # automatic mixed precision (fp16)
  compile: false              # torch.compile — enable for PyTorch 2.x speedup
  ema: true                   # exponential moving average of weights
  ema_decay: 0.9999

# ── Logging ───────────────────────────────────────────────────────────────────
logging:
  wandb: false
  project: weapon_detection
  save_dir: ./runs
  save_period: 10             # save checkpoint every N epochs
  patience: 30                # early stopping patience
